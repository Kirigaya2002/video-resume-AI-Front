<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Resumen</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container mt-5">
      <h1>Resumen de videos con IA</h1>

      <br />

      <div class="mb-3 video-upload">
        <p id="file-p">Haz clic para subir, o arrastra el video aquí</p>
        <input type="file" id="file-video" name="filename" />
      </div>
      <div id="alert-empty" class="alert alert-danger" role="alert">
        No se ha seleccionado ningún video.
      </div>
      <div id="alert-bad-format" class="alert alert-danger" role="alert">
        El video debe estar en formato mp4.
      </div>

      <br />

      <div class="mb-3">
        <div class="d-grid gap-2">
          <button id="btn-process" class="btn btn-primary" type="button">
            Procesar video
          </button>
        </div>
      </div>

      <div id="alert-success" class="alert alert-success" role="alert">
        El video se ha procesado correctamente.
      </div>

      <div id="alert-bad-server" class="alert alert-danger" role="alert" >
        Error de conexión con el servidor. Inténtalo de nuevo más tarde.
      </div>

      <br />

      <hr />

      <!-- validar si ya proceso el texto -->
      <div class="mb-3">
        <p>Texto resumido:</p>
      </div>

      <br />

      <div class="mb-3">
        <textarea
          class="form-control"
          id="summary"
          rows="3"
          readonly
        ></textarea>
      </div>

      <br />

      <div class="mb-3">
        <div class="d-grid gap-2">
          <button id="btn-download" class="btn btn-primary" type="button" disabled>
            Descargar resumen .txt
          </button>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"
  ></script>
</html>
